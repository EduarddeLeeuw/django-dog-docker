version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=dogapi_db
      - POSTGRES_USER=dog
      - POSTGRES_PASSWORD=hondje
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/dogapi
    depends_on:
      - db

volumes:
  postgres_data: